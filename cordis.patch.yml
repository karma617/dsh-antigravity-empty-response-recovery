# dsh-antigravity-empty-response-recovery bundle patch
# Inserts the recovery interceptor into the profile patch stack
- insert:
    - id: dsh-antigravity-empty-response-recovery
      name: 'dsh-antigravity-empty-response-recovery'
      config:
        enabled: true
        interceptAllProviders: true
        targetModels:
          - gemini
          - antigravity
          - flash
        retryWithNudge: true
        nudgePrompt: '上一个操作已执行完毕。请分析当前执行结果并继续完成任务或输出结论。'
        enableToolChoiceNone: true
        syntheticFallback: true
        syntheticResponse: '已自动捕获并恢复前序空响应。当前任务上下文已完整保留，请继续下一步操作。'
        autoContinueOnSynthetic: true
        autoContinuePrompt: '上一个操作已执行完毕，任务未结束。请根据已知执行结果与上下文，继续执行下一步任务或输出最终分析结论。'
        autoContinueMaxConsecutive: 3
        logFilePath: ''
        logLevel: info